<!DOCTYPE html>
<html>
<head>
    <title>MindEase Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        #chatbox { width: 50%; margin: auto; border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>
    <h1>MindEase Chatbot</h1>
    <div id="chatbox"></div>
    <input id="userInput" type="text" placeholder="Type a message..." onkeydown="if(event.keyCode==13){sendMessage();}"/>
    <button onclick="sendMessage()">Send</button>

    <script>
        function sendMessage() {
            var userText = document.getElementById("userInput").value;
            var chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += "<div><b>You:</b> " + userText + "</div>";
            fetch("/get?msg=" + userText)
            .then(response => response.text())
            .then(data => {
                chatbox.innerHTML += "<div><b>MindEase:</b> " + data + "</div>";
                chatbox.scrollTop = chatbox.scrollHeight;
            });
            document.getElementById("userInput").value = "";
        }
    </script>
</body>
</html>
